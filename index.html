<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>root@pacman-arcade:~#</title>
    <!-- Importing Retro Developer Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Fira+Code:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --matrix-green: #00FF33;
            --dim-green: #004400;
            --pacman-yellow: #FFD700;
            --terminal-dark: #050505;
            --scanline-color: rgba(0, 255, 51, 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Fira Code', monospace;
            background-color: var(--terminal-dark);
            color: var(--matrix-green);
            padding: 10px;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* Scanline CRT glass tube simulation filter */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(var(--scanline-color) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.04));
            z-index: 9999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .terminal-container {
            width: 100%;
            max-width: 700px;
            background-color: rgba(5, 5, 5, 0.95);
            border: 2px solid var(--matrix-green);
            border-radius: 8px;
            box-shadow: 0 0 35px rgba(0, 255, 51, 0.25);
            padding: 15px;
        }

        .terminal-header {
            background-color: #111;
            border-bottom: 2px solid var(--matrix-green);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .window-buttons {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 1px solid var(--matrix-green);
        }
        .dot.red { background-color: #ff5555; }
        .dot.yellow { background-color: #ffb86c; }
        .dot.green { background-color: #50fa7b; }

        .terminal-title {
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            color: var(--pacman-yellow);
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 15px;
            text-shadow: 0 0 8px var(--pacman-yellow);
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.75rem;
            margin-bottom: 15px;
            padding: 5px 10px;
            background: rgba(0, 255, 51, 0.05);
            border: 1px solid var(--dim-green);
        }

        /* Canvas Game Frame Layout Grid */
        #game-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        canvas {
            border: 4px solid var(--matrix-green);
            background-color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 51, 0.1);
        }

        .controls-hint {
            text-align: center;
            font-size: 0.85rem;
            color: #88ff88;
            margin-top: 10px;
            border-top: 1px dashed var(--dim-green);
            padding-top: 10px;
        }

        .btn-restart {
            display: block;
            width: 100%;
            margin-top: 10px;
            font-family: 'Press Start 2P', cursive;
            background: transparent;
            color: var(--matrix-green);
            border: 1px solid var(--matrix-green);
            padding: 10px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-restart:hover {
            background: var(--matrix-green);
            color: var(--terminal-dark);
            box-shadow: 0 0 15px var(--matrix-green);
        }
    </style>
</head>
